<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dettaglio prodotto Tappezzeria Fariello.">
  <title>Prodotto | Tappezzeria Fariello</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20201e;--paper:#f1efe9;--clay:#2a5b3d;--line:rgba(32,32,30,.18);--muted:#77746e;--serif:'Playfair Display',Georgia,serif;--sans:'Manrope',sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);cursor:none}a,button{font:inherit;color:inherit}a{text-decoration:none}button{border:0;background:none;cursor:none}.cursor,.cursor-ring{position:fixed;pointer-events:none;z-index:20;border-radius:50%;transform:translate(-50%,-50%)}.cursor{width:6px;height:6px;background:var(--clay)}.cursor-ring{width:32px;height:32px;border:1px solid var(--ink);transition:width .25s,height .25s,border-color .25s,background .25s}.cursor-ring.active{width:64px;height:64px;border-color:var(--clay);background:rgba(42,91,61,.1)}
    .topbar{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font:500 21px var(--serif);letter-spacing:-.02em}.brand-logo{width:38px;height:38px;object-fit:contain;flex:0 0 38px}.brand-copy{display:block}.brand-copy span{font:11px var(--mono);display:block;letter-spacing:.13em;text-transform:uppercase;opacity:.65;margin-top:3px}.home-link{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em}.home-link:before{content:'← ';color:var(--clay)}
    .product-page{min-height:calc(100svh - 132px);padding:8vh 5vw 12vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:8vw;align-items:start}.gallery{display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;position:sticky;top:30px}.gallery-main{aspect-ratio:4/5;background:#c9c5bd;overflow:hidden}.gallery-main img{width:100%;height:100%;object-fit:cover;display:block}.gallery-thumbs{display:flex;flex-direction:column;gap:10px}.gallery-thumb{width:80px;aspect-ratio:1/1;border:1px solid transparent;padding:0;overflow:hidden;background:#c9c5bd}.gallery-thumb.selected{border-color:var(--clay)}.gallery-thumb img{width:100%;height:100%;object-fit:cover}.product-copy{padding-top:5vh}.product-category{font:11px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--clay);margin-bottom:20px}.product-copy h1{font:500 clamp(3.2rem,7vw,7rem)/.94 var(--serif);letter-spacing:-.055em;margin:0 0 30px}.product-copy p{max-width:470px;color:var(--muted);font-size:15px;line-height:1.9;margin:0 0 40px}.product-index{font:11px var(--mono);color:var(--muted);letter-spacing:.08em}.status{font:14px var(--mono);color:var(--muted);padding:12vh 5vw}footer{padding:28px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}footer a{text-decoration:underline}@media(max-width:700px){body{cursor:auto}.cursor,.cursor-ring{display:none}.topbar{height:65px;padding:0 6vw}.brand{font-size:18px}.product-page{display:block;padding:40px 6vw 80px}.gallery{position:static;display:flex;flex-direction:column-reverse;gap:12px}.gallery-thumbs{flex-direction:row;overflow-x:auto}.gallery-thumb{width:64px;flex:0 0 64px}.product-copy{padding-top:55px}.product-copy h1{font-size:16vw}.product-copy p{font-size:14px}footer{flex-direction:column;align-items:center;text-align:center;line-height:1.8}}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  </style>
  <script src="/navigation.js" defer></script>
</head>
<body>
  <div class="cursor"></div><div class="cursor-ring"></div>
  <header class="topbar"><a class="brand" href="/" aria-label="Tappezzeria Fariello"><img class="brand-logo" src="favicon.ico" alt=""><span class="brand-copy"><span id="businessName">Tappezzeria Fariello</span><span>artigiani dal 2006</span></span></a><a class="home-link" href="/" aria-label="Torna alla collezione">Torna alla collezione</a></header>
  <main id="productPage" class="product-page" hidden>
    <section class="gallery" aria-label="Galleria immagini prodotto"><div class="gallery-thumbs" id="galleryThumbs"></div><div class="gallery-main"><img id="galleryMain" alt=""></div></section>
    <section class="product-copy"><div class="product-category" id="productCategory"></div><h1 id="productName"></h1><p id="productDescription"></p><div class="product-index" id="productIndex"></div></section>
  </main>
  <p class="status" id="productStatus">Caricamento prodotto...</p>
  <footer><span>Tappezzeria Fariello</span><span><a href="/privacy.html">Privacy</a> / <a href="/cookie.html">Cookie</a></span><span>Fatto con cura in Puglia</span></footer>
  <script>
    const params=new URLSearchParams(location.search),productId=params.get('id'),mainImage=document.querySelector('#galleryMain'),thumbs=document.querySelector('#galleryThumbs'),page=document.querySelector('#productPage'),status=document.querySelector('#productStatus');let galleryImages=[],activeImage=0;
    function selectImage(index){activeImage=index;mainImage.src=galleryImages[index];mainImage.alt=document.querySelector('#productName').textContent;thumbs.querySelectorAll('.gallery-thumb').forEach((thumb,itemIndex)=>thumb.classList.toggle('selected',itemIndex===index));document.querySelector('#productIndex').textContent=`${String(index+1).padStart(2,'0')} / ${String(galleryImages.length).padStart(2,'0')}`}
    function renderProduct(product){galleryImages=Array.isArray(product.images)&&product.images.length?product.images:[product.image];document.title=`${product.name} | Tappezzeria Fariello`;document.querySelector('#productCategory').textContent=product.category;document.querySelector('#productName').textContent=product.name;document.querySelector('#productDescription').textContent=product.description;thumbs.innerHTML=galleryImages.map((image,index)=>`<button class="gallery-thumb" type="button" aria-label="Mostra foto ${index+1}"><img src="${image}" alt=""></button>`).join('');thumbs.querySelectorAll('.gallery-thumb').forEach((thumb,index)=>thumb.addEventListener('click',()=>selectImage(index)));page.hidden=false;status.hidden=true;selectImage(0)}
    async function loadProduct(){try{if(!productId)throw new Error('Prodotto non trovato');const response=await fetch(`/api/products/${encodeURIComponent(productId)}`);if(response.status===404)throw new Error('Prodotto non trovato');if(!response.ok)throw new Error('Impossibile caricare il prodotto');renderProduct(await response.json())}catch(error){status.textContent=error.message}}
    document.addEventListener('keydown',event=>{if(!galleryImages.length)return;if(event.key==='ArrowRight')selectImage((activeImage+1)%galleryImages.length);if(event.key==='ArrowLeft')selectImage((activeImage-1+galleryImages.length)%galleryImages.length)});document.querySelectorAll('a,button').forEach(element=>{element.addEventListener('mouseenter',()=>document.querySelector('.cursor-ring').classList.add('active'));element.addEventListener('mouseleave',()=>document.querySelector('.cursor-ring').classList.remove('active'))});const cursor=document.querySelector('.cursor'),ring=document.querySelector('.cursor-ring');window.addEventListener('mousemove',event=>{cursor.style.left=`${event.clientX}px`;cursor.style.top=`${event.clientY}px`;ring.style.left=`${event.clientX}px`;ring.style.top=`${event.clientY}px`});loadProduct();
  </script>
</body>
</html>
