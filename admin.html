<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Area riservata | Tappezzeria Fariello</title>
  <style>
    :root{--ink:#20201e;--paper:#f1efe9;--clay:#2a5b3d;--line:#d7d2c8;--muted:#77746e}::selection{background:var(--clay);color:var(--paper)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:25px}.login-card,.panel{background:#fff;border:1px solid var(--line);padding:34px}.login-card{width:min(430px,100%)}h1,h2{font-family:Georgia,serif;font-weight:500;margin:0 0 12px}.login-card h1{font-size:38px}.sub{color:var(--muted);line-height:1.6;margin:0 0 28px}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);padding:12px;background:#fff;color:var(--ink);outline-color:var(--clay)}textarea{resize:vertical}.button{border:0;background:var(--ink);color:#fff;padding:13px 17px;cursor:pointer}.button.alt{background:var(--clay)}.button.danger{background:transparent;color:#a23f30;border:1px solid #d9aaa0}.error,.status{display:block;color:#a23f30;margin-top:14px}.hidden{display:none!important}.admin{max-width:1180px;margin:auto;padding:36px 24px}.admin-header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:25px}.admin-header h1{font-size:42px}.admin-header small{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.toolbar h2{font-size:27px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.product-list{display:grid;gap:10px}.product-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px;background:#fff;border:1px solid var(--line)}.product-row strong{font-family:Georgia,serif;font-size:18px;font-weight:500}.product-row small{display:block;color:var(--clay);margin-top:5px}.actions{display:flex;gap:7px;flex-shrink:0}.messages{display:grid;gap:10px}.message{background:#fff;border:1px solid var(--line);padding:16px}.message strong{font-family:Georgia,serif;font-size:18px}.message time{float:right;color:var(--muted);font-size:11px}.message p{line-height:1.6;color:#45443f;margin-bottom:0}.empty{color:var(--muted);padding:20px 0}@media(max-width:700px){.admin{padding:22px 15px}.admin-header{align-items:start;gap:15px}.admin-header h1{font-size:31px}.grid{grid-template-columns:1fr}.panel,.login-card{padding:24px}.product-row{align-items:start;flex-direction:column}.actions{width:100%}.actions .button{flex:1}.toolbar{align-items:start;gap:12px}.toolbar h2{font-size:24px}}
  </style>
</head>
<body>
  <main id="loginView" class="login"><form class="login-card" id="loginForm"><h1>Area riservata</h1><p class="sub">Gestisci la collezione di Tappezzeria Fariello.</p><div class="field"><label for="email">Email amministratore</label><input id="email" name="email" type="email" autocomplete="username" autofocus required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button alt" type="submit">Accedi al pannello</button><span id="loginError" class="error" role="alert"></span></form></main>
  <main id="adminView" class="admin hidden"><header class="admin-header"><div><small>AREA RISERVATA</small><h1>Catalogo</h1></div><button id="logout" class="button">Esci</button></header><div class="grid"><section class="panel"><div class="toolbar"><h2 id="formTitle">Nuovo prodotto</h2><button id="cancelEdit" class="button danger hidden" type="button">Annulla</button></div><form id="productForm"><input type="hidden" id="productId"><div class="field"><label for="name">Nome</label><input id="name" required maxlength="120"></div><div class="field"><label for="category">Categoria</label><select id="category" required><option value="Letti">Letti</option><option value="Divani">Divani</option><option value="Poltrone">Poltrone</option><option value="Materassi">Materassi</option></select></div><div class="field"><label for="images">URL foto</label><textarea id="images" rows="4" placeholder="Un URL per riga" required></textarea></div><div class="field"><label for="description">Descrizione</label><textarea id="description" rows="4" maxlength="500" required></textarea></div><button class="button alt" type="submit">Salva prodotto</button><span id="productStatus" class="status" role="status"></span></form></section><section class="panel"><div class="toolbar"><h2>Prodotti pubblicati</h2></div><div id="productList" class="product-list"></div></section></div><section class="panel" style="margin-top:24px"><div class="toolbar"><h2>Richieste ricevute</h2></div><div id="messageList" class="messages"></div></section></main>
  <script>
    const loginView=document.querySelector('#loginView'),adminView=document.querySelector('#adminView'),loginError=document.querySelector('#loginError'),productForm=document.querySelector('#productForm'),productList=document.querySelector('#productList'),messageList=document.querySelector('#messageList');let products=[];
    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(response.status===401){showLogin();throw new Error('Sessione scaduta.')}if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||'Operazione non riuscita.')}return response.status===204?null:response.json()}
    function showLogin(){loginView.classList.remove('hidden');adminView.classList.add('hidden')}
    function showAdmin(){loginView.classList.add('hidden');adminView.classList.remove('hidden');loadDashboard()}
    function productFields(product={}){return{name:product.name||'',category:product.category||'Letti',images:Array.isArray(product.images)&&product.images.length?product.images:[product.image||''],description:product.description||''}}
    function renderProducts(){productList.innerHTML=products.length?products.map(product=>`<div class="product-row"><div><strong>${escapeHtml(product.name)}</strong><small>${escapeHtml(product.category)}</small></div><div class="actions"><button class="button" data-edit="${product.id}">Modifica</button><button class="button danger" data-delete="${product.id}">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun prodotto inserito.</div>';productList.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>editProduct(button.dataset.edit));productList.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>deleteProduct(button.dataset.delete))}
    function renderMessages(messages){messageList.innerHTML=messages.length?messages.map(message=>`<article class="message"><time>${new Date(message.createdAt).toLocaleString('it-IT')}</time><strong>${escapeHtml(message.name)}</strong><div>${escapeHtml(message.email)}</div><p>${escapeHtml(message.message)}</p><button class="button ${message.read?'':'alt'}" data-read="${message.id}" ${message.read?'disabled':''}>${message.read?'Letto':'Segna come letto'}</button></article>`).join(''):'<div class="empty">Nessuna richiesta ricevuta.</div>';messageList.querySelectorAll('[data-read]').forEach(button=>button.onclick=()=>markMessageRead(button.dataset.read))}
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]))}
    async function loadDashboard(){try{const [productData,messages]=await Promise.all([api('/api/products'),api('/api/admin/messages')]);products=productData;renderProducts();renderMessages(messages)}catch(error){}}
    function editProduct(id){const product=products.find(item=>String(item.id)===String(id));if(!product)return;const fields=productFields(product);document.querySelector('#productId').value=product.id;document.querySelector('#name').value=fields.name;document.querySelector('#category').value=fields.category;document.querySelector('#images').value=fields.images.join('\n');document.querySelector('#description').value=fields.description;document.querySelector('#formTitle').textContent='Modifica prodotto';document.querySelector('#cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
    function resetForm(){productForm.reset();document.querySelector('#productId').value='';document.querySelector('#formTitle').textContent='Nuovo prodotto';document.querySelector('#cancelEdit').classList.add('hidden');document.querySelector('#productStatus').textContent=''}
    async function deleteProduct(id){if(!window.confirm('Eliminare questo prodotto?'))return;try{await api(`/api/admin/products/${id}`,{method:'DELETE'});products=products.filter(product=>product.id!==id);renderProducts()}catch(error){alert(error.message)}}
    async function markMessageRead(id){try{await api(`/api/admin/messages/${id}/read`,{method:'PATCH'});const messages=await api('/api/admin/messages');renderMessages(messages)}catch(error){alert(error.message)}}
    const loginForm=document.querySelector('#loginForm');loginForm.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')){event.preventDefault();loginForm.requestSubmit()}});loginForm.onsubmit=async event=>{event.preventDefault();loginError.textContent='';const data=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(data)});showAdmin()}catch(error){loginError.textContent=error.message}};
    productForm.onsubmit=async event=>{event.preventDefault();const id=document.querySelector('#productId').value;const body={name:document.querySelector('#name').value,category:document.querySelector('#category').value,images:document.querySelector('#images').value.split(/\r?\n/),description:document.querySelector('#description').value};try{const saved=await api(id?`/api/admin/products/${id}`:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(body)});if(id)products=products.map(product=>String(product.id)===String(id)?saved:product);else products.unshift(saved);renderProducts();resetForm();document.querySelector('#productStatus').textContent='Prodotto salvato.'}catch(error){document.querySelector('#productStatus').textContent=error.message}};
    document.querySelector('#cancelEdit').onclick=resetForm;document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});showLogin()};api('/api/auth/me').then(showAdmin).catch(showLogin);
  </script>
</body>
</html>
